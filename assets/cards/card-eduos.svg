<text x="139" y="170" text-anchor="middle" fill="#F5F5F5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5">PostgreSQL</text>
<rect x="187" y="158" width="33" height="17" rx="8.5" fill="#161B22" stroke="#2A3440" stroke-width="1"/>
<text x="203" y="170" text-anchor="middle" fill="#F5F5F5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5">RLS</text>
