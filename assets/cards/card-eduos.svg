<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 188" width="320" height="188" role="img" aria-label="EduOS project card: Multi-tenant K-12 school operating system. Modular monolith, strict tenant isolation with Postgres RLS.">
<title>EduOS - case study</title>
<rect width="320" height="188" fill="#10151C" rx="10"/>
<rect x="0.75" y="0.75" width="318.5" height="186.5" fill="none" stroke="#1E2630" stroke-width="1.5" rx="9.25"/>
<rect x="0" y="0" width="64" height="5" fill="#E5252A" rx="2.5"/>
