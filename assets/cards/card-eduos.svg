<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 158" width="280" height="158" role="img" aria-label="EduOS project card: Multi-tenant K-12 school operating system. Modular monolith, strict tenant isolation with Postgres RLS.">
<title>EduOS - case study</title>
<rect width="280" height="158" fill="#10151C" rx="10"/>
<rect x="0.75" y="0.75" width="278.5" height="156.5" fill="none" stroke="#1E2630" stroke-width="1.5" rx="9.25"/>
<rect x="0" y="0" width="52" height="4" fill="#E5252A" rx="2"/>
