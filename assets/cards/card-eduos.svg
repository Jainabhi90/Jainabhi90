<text x="125" y="140" text-anchor="middle" fill="#F5F5F5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="8.5">PostgreSQL</text>
<text x="268" y="142" text-anchor="end" fill="#8B949E" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="8">PRIVATE REPO</text>
